name: Publish MathCalculator to NuGet

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack MathCalculator
        run: dotnet pack .\MathCalculator.csproj -c Release --no-dependencies -o .\nupkg

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        with:
          user-api-key-fallback: false

      - name: Push to NuGet.org
        run: dotnet nuget push .\nupkg\*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate